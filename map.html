<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFF3DF">
<title>Spotted In</title>
<meta name="description" content="A map of spots worth going to, made with Spotted In.">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<!--
  Public Profile Map: /m/<slug> (vercel.json rewrites it here). Read-only, no sign-in.
  Reads one row of nyc_public_maps (supabase/public.sql) with the public key, and shows it on Apple Maps.
-->
<style>
:root{--navy:#10183F;--blue:#1B3DB8;--yellow:#FFC425;--orange:#FF6B1A;--cream:#FFF3DF;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  --glass:linear-gradient(150deg,rgba(255,255,255,.82),rgba(255,255,255,.5) 50%,rgba(255,255,255,.68));}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--cream);color:var(--navy);font-family:Archivo,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit}
#map{position:fixed;inset:0;background:#F2EFE9}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(28px) saturate(200%);backdrop-filter:blur(28px) saturate(200%);border:1px solid rgba(255,255,255,.9);box-shadow:0 12px 30px rgba(16,24,63,.14)}
header{position:fixed;top:calc(var(--st) + 10px);left:12px;right:12px;z-index:5;border-radius:26px;padding:14px 16px 12px;max-width:560px;margin:0 auto}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mark{font-weight:900;font-stretch:72%;font-size:15px;letter-spacing:.5px;color:var(--yellow);text-shadow:1.5px 1.5px 0 #E5402B,3px 3px 0 var(--navy)}
.mark span{display:inline-block;margin-left:5px;font-size:11px;font-stretch:100%;letter-spacing:0;text-shadow:none;background:var(--navy);color:#fff;border-radius:999px;padding:2px 8px;vertical-align:2px}
.cta{height:30px;padding:0 12px;border-radius:999px;border:0;background:var(--navy);color:#fff;font-size:12px;font-weight:800;text-decoration:none;display:inline-flex;align-items:center}
h1{margin:8px 0 2px;font-size:32px;line-height:1;letter-spacing:-1.2px;font-weight:900;font-style:italic}
h1 em{font-weight:200;font-style:normal}
.sub{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:1px;color:#4A5275}
.chips{display:flex;gap:6px;overflow-x:auto;margin:10px -16px 0;padding:0 16px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 12px;border-radius:999px;border:1px solid rgba(16,24,63,.1);background:#fff;font-size:13px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.dot{width:8px;height:8px;border-radius:50%}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;max-width:560px;margin:0 auto;border-radius:28px 28px 0 0;padding:8px 12px calc(var(--sb) + 12px);max-height:46vh;overflow-y:auto}
.grab{width:40px;height:5px;border-radius:9px;background:rgba(16,24,63,.18);margin:2px auto 8px}
.row{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;padding:7px 4px;text-align:left;cursor:pointer;border-radius:16px}
.row:active{background:rgba(16,24,63,.05)}
.thumb{position:relative;width:52px;height:52px;flex:none;border-radius:16px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:22px}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.nm{font-size:16px;font-weight:900;font-style:italic;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.6px;color:#4A5275;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.dish{font-size:12.5px;font-weight:800;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.been{flex:none;height:22px;padding:0 8px;border-radius:999px;background:rgba(31,157,107,.14);color:#167A53;font-size:11px;font-weight:800;display:flex;align-items:center}
.card .hero{position:relative;height:190px;border-radius:22px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:54px;margin-bottom:12px}
.card .hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card h2{margin:0;font-size:34px;line-height:.95;letter-spacing:-1.4px;font-weight:900;font-style:italic}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pill{min-height:30px;padding:5px 12px;border-radius:999px;background:rgba(255,196,37,.3);border:1px solid rgba(229,64,43,.18);font-size:13px;font-weight:800;display:inline-flex;align-items:center}
.lab{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:1.2px;color:#4A5275;margin-top:14px}
.ev{display:inline-flex;align-items:center;gap:8px;margin-top:10px;padding:7px 12px;border-radius:16px;background:rgba(255,107,26,.14);font-size:13.5px;font-weight:800}
.btns{display:flex;gap:8px;margin-top:16px}
.btn{flex:1;height:48px;border-radius:999px;border:0;font-size:14.5px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none}
.btn.go{background:var(--orange);color:#fff;box-shadow:0 4px 10px rgba(255,107,26,.3)}
.btn.sec{background:rgba(16,24,63,.07);color:var(--navy)}
.back{border:0;background:none;font-size:13px;font-weight:800;color:var(--blue);padding:4px 2px 10px;cursor:pointer}
.msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:30px;text-align:center;z-index:9}
.msg div{border-radius:26px;padding:26px 22px;max-width:360px}
.msg h2{margin:0 0 8px;font-size:26px;font-weight:900;font-style:italic;letter-spacing:-.8px}
.msg p{margin:0 0 16px;font-size:14.5px;font-weight:600;color:#4A5275;line-height:1.45}
.pin{width:34px;height:34px;border-radius:50%;border:2.5px solid #fff;display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 4px 10px rgba(16,24,63,.25);transform:translate(-50%,-50%)}
</style>
</head>
<body>
<div id="map"></div>
<header class="glass" id="head" hidden>
  <div class="brand"><span class="mark">SPOTTED<span>in</span></span><a class="cta" href="/">Make Your Own</a></div>
  <h1 id="title"></h1>
  <div class="sub" id="count"></div>
  <div class="chips" id="cities"></div>
  <div class="chips" id="cats"></div>
</header>
<div id="sheet" class="glass" hidden></div>
<div class="msg" id="msg" hidden><div class="glass"><h2 id="msgT"></h2><p id="msgP"></p><a class="btn go" href="/" style="display:flex">Open Spotted In</a></div></div>
<script src="/config.js"></script>
<script>
"use strict";
const CITY={nyc:['New York City','NYC','🗽','New York',[40.722,-73.97]],sg:['Singapore','SG','🦁','Singapore',[1.3,103.84]],hk:['Hong Kong','HKG','🌃','Hong Kong',[22.3,114.17]],
  to:['Toronto','TO','🍁','Toronto',[43.66,-79.39]],bos:['Boston','BOS','🦞','Boston, MA',[42.355,-71.075]],dc:['Washington, DC','DC','🏛️','Washington, DC',[38.9,-77.03]]};
const ORDER=['nyc','sg','hk','to','bos','dc'],PRICES=['$','$$','$$$','$$$$'];
const $=id=>document.getElementById(id);
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug=(location.pathname.match(/^\/m\/([a-z0-9-]{3,40})\/?$/)||[])[1]||new URLSearchParams(location.search).get('u')||'';
let D=null,cats={},city='nyc',catOn='',sel=null,map=null,marks=[];
const photo=p=>p.photo||('/api/photo?q='+encodeURIComponent([p.name,p.area,(CITY[p.city]||CITY.nyc)[3]].filter(Boolean).join(', '))+'&ll='+(+p.lat).toFixed(5)+','+(+p.lng).toFixed(5)+'&v=2');
const fg=c=>{const h=String(c||'#888').replace('#','');const n=parseInt(h.length===3?h.split('').map(x=>x+x).join(''):h,16);return ((n>>16)*299+((n>>8)&255)*587+(n&255)*114)/1000>160?'#10183F':'#fff';};
const evOver=e=>{if(!e||!e.d1)return false;const t=new Date().toISOString().slice(0,10);return (e.d2||e.d1)<t;};
const evWhen=e=>{const d=x=>new Date(x+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});return d(e.d1)+(e.d2&&e.d2!==e.d1?' – '+d(e.d2).replace(/^\w+, /,''):'')+(e.tm?' · '+e.tm:'');};
function fail(t,p){$('msgT').textContent=t;$('msgP').textContent=p;$('msg').hidden=false;}
async function load(){
  const cfg=window.NYC_CONFIG||{};if(!slug)return fail('No Map Here','This link is missing the map’s name.');
  try{const r=await fetch(cfg.supabaseUrl+'/rest/v1/nyc_public_maps?select=name,data,updated_at&live=eq.true&slug=eq.'+encodeURIComponent(slug),{headers:{apikey:cfg.supabaseAnonKey,authorization:'Bearer '+cfg.supabaseAnonKey}});
    const rows=r.ok?await r.json():null;D=rows&&rows[0];}catch(e){}
  if(!D)return fail('This Map Is Off','The link may have changed, or its owner turned the public map off.');
  const spots=((D.data&&D.data.spots)||[]).filter(p=>isFinite(p.lat)&&isFinite(p.lng)&&!evOver(p.ev));
  spots.forEach(p=>{if(!CITY[p.city])p.city='nyc';});D.spots=spots;(D.data.cats||[]).forEach(c=>cats[c.id]=c);
  const name=(D.name||'').trim(),pos=name?(/s$/i.test(name)?name+'’':name+'’s'):'My';
  document.title=pos+' Map · Spotted In';$('title').innerHTML=esc(pos)+' <em>Map</em>';
  const by={};spots.forEach(p=>by[p.city||'nyc']=(by[p.city||'nyc']||0)+1);
  const have=ORDER.filter(k=>by[k]);city=have.sort((a,b)=>by[b]-by[a])[0]||'nyc';
  $('cities').innerHTML=have.length>1?ORDER.filter(k=>by[k]).map(k=>`<button class="chip" data-city="${k}">${CITY[k][2]} ${CITY[k][1]} · ${by[k]}</button>`).join(''):'';
  $('cities').onclick=e=>{const b=e.target.closest('[data-city]');if(b){city=b.dataset.city;catOn='';sel=null;render(true);}};
  $('cats').onclick=e=>{const b=e.target.closest('[data-cat]');if(b){catOn=catOn===b.dataset.cat?'':b.dataset.cat;sel=null;render(true);}};
  $('sheet').onclick=e=>{const b=e.target.closest('[data-i]');if(b){sel=+b.dataset.i;render(false,true);}else if(e.target.closest('[data-back]')){sel=null;render();}};
  $('head').hidden=false;$('sheet').hidden=false;startMap();render(true);}
const here=()=>D.spots.map((p,i)=>({p,i})).filter(x=>(x.p.city||'nyc')===city&&(!catOn||x.p.cat===catOn));
function render(fit,focus){
  const inCity=D.spots.filter(p=>(p.city||'nyc')===city),been=inCity.filter(p=>p.been).length;
  $('count').textContent=(inCity.length+(inCity.length===1?' SPOT':' SPOTS')+' IN '+CITY[city][1]+(been?' · '+been+' BEEN THERE':'')).toUpperCase();
  [...$('cities').children].forEach(b=>b.classList.toggle('on',b.dataset.city===city));
  const used=[...new Set(inCity.map(p=>p.cat))].filter(id=>cats[id]);
  $('cats').innerHTML=used.length>1?used.map(id=>{const c=cats[id];return `<button class="chip${catOn===id?' on':''}" data-cat="${esc(id)}"><span class="dot" style="background:${esc(c.color)}"></span>${esc(c.name)}</button>`;}).join(''):'';
  const list=here();$('sheet').style.maxHeight=sel!=null?'64vh':'';
  if(sel!=null&&D.spots[sel]){const p=D.spots[sel],c=cats[p.cat]||{name:'',color:'#888',emoji:'📍'},q=encodeURIComponent(p.name+', '+[p.area,(CITY[p.city]||CITY.nyc)[3]].filter(Boolean).join(', '));
    $('sheet').innerHTML=`<div class="grab"></div><div class="card"><button class="back" data-back>← All Spots</button>
      <div class="hero" style="background:${esc(c.color)};color:${fg(c.color)}">${esc(c.emoji||'📍')}<img src="${esc(photo(p))}" alt="" onerror="this.remove()"></div>
      <div class="meta">${esc([c.name,p.area,p.price?PRICES[p.price-1]:''].filter(Boolean).join(' · ').toUpperCase())}</div>
      <h2>${esc(p.name)}</h2>
      ${p.been?'<div class="pills"><span class="been">✓ Been There</span></div>':''}
      ${p.ev&&p.ev.n?`<div class="ev">📅 <span>${esc(p.ev.n)} · ${esc(evWhen(p.ev))}</span></div>`:''}
      ${p.order&&p.order.length?`<div class="lab">WHAT TO ORDER</div><div class="pills">${p.order.map((d,i)=>`<span class="pill">${i?'':'⭐ '}${esc(d)}</span>`).join('')}</div>`:''}
      <div class="btns"><a class="btn go" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${q}">Open In Google Maps</a>${p.url?`<a class="btn sec" target="_blank" rel="noopener" href="${esc(p.url)}">See The Post</a>`:''}</div></div>`;
    $('sheet').scrollTop=0;if(map&&focus){try{map.setCenterAnimated(new mapkit.Coordinate(p.lat-.004,p.lng));}catch(e){}}}
  else $('sheet').innerHTML='<div class="grab"></div>'+(list.length?list.map(({p,i})=>{const c=cats[p.cat]||{color:'#888',emoji:'📍',name:''};
    return `<button class="row" data-i="${i}"><span class="thumb" style="background:${esc(c.color)};color:${fg(c.color)}">${esc(c.emoji||'📍')}<img loading="lazy" src="${esc(photo(p))}" alt="" onerror="this.remove()"></span>
      <span style="flex:1;min-width:0"><div class="nm">${esc(p.name)}</div><div class="meta">${esc([c.name,p.area,p.price?PRICES[p.price-1]:''].filter(Boolean).join(' · ').toUpperCase())}</div>
      ${p.ev&&p.ev.n?`<div class="dish" style="color:#E5402B">📅 ${esc(p.ev.n)}</div>`:p.order&&p.order[0]?`<div class="dish">⭐ ${esc(p.order[0])}</div>`:''}</span>${p.been?'<span class="been">Been</span>':''}</button>`;}).join(''):'<p class="sub" style="text-align:center;padding:18px">NOTHING HERE YET</p>');
  drawPins(fit);}
function drawPins(fit){if(!map)return;try{map.removeAnnotations(marks);}catch(e){}
  marks=here().map(({p,i})=>{const c=cats[p.cat]||{color:'#888',emoji:'📍'};
    const a=new mapkit.Annotation(new mapkit.Coordinate(p.lat,p.lng),()=>{const el=document.createElement('div');el.className='pin';el.style.background=c.color;el.style.opacity=p.been&&sel!==i?.75:1;
      if(sel===i){el.style.width=el.style.height='46px';el.style.fontSize='22px';}el.textContent=c.emoji||'📍';return el;},{anchorOffset:new DOMPoint(0,0),calloutEnabled:false,data:{i}});
    a.addEventListener('select',()=>{sel=i;render(false,true);});return a;});
  map.addAnnotations(marks);if(fit&&marks.length){try{map.showItems(marks,{animate:false,padding:new mapkit.Padding(230,40,Math.round(innerHeight*.46)+20,40)});}catch(e){}}
  else if(fit){const c=CITY[city][4];try{map.region=new mapkit.CoordinateRegion(new mapkit.Coordinate(c[0],c[1]),new mapkit.CoordinateSpan(.2,.2));}catch(e){}}}
function startMap(){fetch('/api/mapkit-token',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{if(!j||!j.token)return;let first=j.token;
  const sc=document.createElement('script');sc.src='https://cdn.apple-mapkit.com/mk/5.x.x/mapkit.js';sc.crossOrigin='anonymous';
  sc.onload=()=>{mapkit.init({authorizationCallback:d=>{if(first){d(first);first=null;}else fetch('/api/mapkit-token',{cache:'no-store'}).then(r=>r.json()).then(t=>d(t.token));},language:'en'});
    map=new mapkit.Map('map',{showsCompass:mapkit.FeatureVisibility.Hidden,showsMapTypeControl:false,showsZoomControl:false,showsPointsOfInterest:false,isRotationEnabled:false});
    if(matchMedia('(prefers-color-scheme: dark)').matches)map.colorScheme=mapkit.Map.ColorSchemes.Dark;drawPins(true);};
  document.head.appendChild(sc);}).catch(()=>{});}
load();
</script>
</body>
</html>
