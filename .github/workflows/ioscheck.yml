name: iOS build check (temporary)
on: { push: { branches: [list-push] } }
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install and sync
        working-directory: native
        run: npm ci && npm run sync
      - name: Build (no signing)
        working-directory: native/ios/App
        run: xcodebuild -project App.xcodeproj -scheme App -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' build CODE_SIGNING_ALLOWED=NO 2>&1 | grep -E "error:|BUILD (SUCCEEDED|FAILED)|PushNotifications" | head -30; exit ${PIPESTATUS[0]}
