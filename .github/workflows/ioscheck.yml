name: iOS build check (temporary)
on: { push: { branches: [share-banner] } }
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install and sync
        working-directory: native
        run: npm ci || npm install; npm run sync
      - name: Build (no signing)
        working-directory: native/ios/App
        run: xcodebuild -project App.xcodeproj -scheme App -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' build CODE_SIGNING_ALLOWED=NO -quiet 2>&1 | tail -40; exit ${PIPESTATUS[0]}
