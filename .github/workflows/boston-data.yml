# Temporary: checks the Bluebikes feed address. Removed once Boston is set up.
name: Boston data (temporary)
on:
  push:
    branches: [main]
    paths: [.github/workflows/boston-data.yml]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for u in https://gbfs.lyft.com/gbfs/2.3/bos/en/station_information.json https://gbfs.lyft.com/gbfs/1.1/bos/en/station_information.json https://gbfs.bluebikes.com/gbfs/gbfs.json; do
            echo "$u $(curl -s -o /tmp/b -w '%{http_code}' "$u") $(head -c 160 /tmp/b | tr -d '\n')" >> data/bluebikes-check.txt; done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bluebikes-check.txt && git commit -m "Bluebikes feed check" && git pull --rebase origin main && git push
