# Temporary: builds data/boston-raw.json from OpenStreetMap. Removed once Boston's station data is in data/city-data.js.
name: Boston data (temporary)
on:
  push:
    branches: [main]
    paths: [scripts/boston-data.js, .github/workflows/boston-data.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/boston-data.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/boston-raw.json
          git commit -m "Boston raw data from OpenStreetMap"
          git pull --rebase origin main
          git push
