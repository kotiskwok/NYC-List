# Rebuilds the Singapore / Hong Kong / Toronto transit route files (data/routes) from OpenStreetMap
# and commits them, which redeploys the site on Vercel. Runs monthly, on demand, and when the builder changes.
name: Build transit routes
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 3 * *'
  push:
    branches: [main]
    paths:
      - scripts/build-routes.js
      - api/_osmroutes.js
      - .github/workflows/routes.yml
permissions:
  contents: write
concurrency:
  group: routes
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-routes.js
      - name: Commit updated routes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/routes
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update transit routes from OpenStreetMap"
          git pull --rebase origin main
          git push
