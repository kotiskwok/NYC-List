# Temporary: builds data/dc-raw.json from OpenStreetMap. Removed once DC's data is in data/city-data.js.
name: DC data (temporary)
on: { push: { branches: [dc-map], paths: [scripts/dc-data.js, .github/workflows/dc-data.yml] } }
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/dc-data.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dc-raw.json
          git commit -m "DC raw data from OpenStreetMap"
          git push origin HEAD:dc-map
