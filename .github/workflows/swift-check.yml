name: Swift typecheck
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p /tmp/r && cd /tmp/r
          { echo 'import SwiftUI'; echo 'import AppKit'; sed -n '/^fileprivate func rgb/,$p' $GITHUB_WORKSPACE/native/ios/App/ShareExtension/ShareViewController.swift | sed 's/private struct ShareCard/struct ShareCard/'; cat <<'SW'
          @MainActor func render(_ saved: Bool, _ link: String, _ name: String) {
            let v = ShareCard(saved: saved, link: link, done: {}).frame(width: 390, height: 520).background(Color(red: 0.95, green: 0.95, blue: 0.97))
            let r = ImageRenderer(content: v); r.scale = 3
            if let img = r.nsImage, let tiff = img.tiffRepresentation, let rep = NSBitmapImageRep(data: tiff), let png = rep.representation(using: .png, properties: [:]) { try? png.write(to: URL(fileURLWithPath: name)) }
          }
          render(true, "https://www.instagram.com/reel/DcKKxNZxsxL/", "saved.png")
          render(false, "", "nolink.png")
          SW
          } > main.swift
          sed -i '' 's/^          //' main.swift
          swiftc -parse-as-library -o r main.swift 2>/tmp/err.txt || swiftc -o r main.swift 2>>/tmp/err.txt; ./r 2>>/tmp/err.txt; ls -la >> /tmp/err.txt
          cd $GITHUB_WORKSPACE
          git config user.name "debug-bot"; git config user.email "debug-bot@users.noreply.github.com"
          git checkout --orphan debug-out4 && git rm -rqf . && cp /tmp/err.txt err.txt && cp /tmp/r/*.png . 2>/dev/null; git add -A && git commit -qm out && git push -f origin debug-out4
