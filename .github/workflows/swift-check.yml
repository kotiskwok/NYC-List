name: Swift typecheck
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p /tmp/r
          { echo 'import SwiftUI'; echo 'import AppKit'; sed -n '/^fileprivate func rgb/,$p' native/ios/App/ShareExtension/ShareViewController.swift | sed 's/private struct ShareCard/struct ShareCard/'; cat scripts/render-share.swift; } > /tmp/r/main.swift
          (cd /tmp/r && swiftc -parse-as-library -o r main.swift && ./r) > /tmp/err.txt 2>&1 || true
          ls -la /tmp/r >> /tmp/err.txt
          git config user.name "debug-bot"; git config user.email "debug-bot@users.noreply.github.com"
          git checkout --orphan debug-out4 && git rm -rqf . && cp /tmp/err.txt err.txt && (cp /tmp/r/*.png . || true) && git add -A && git commit -qm out && git push -f origin debug-out4
