name: Swift typecheck
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          { xcrun swiftc -typecheck -sdk "$SDK" -target arm64-apple-ios15.0 native/ios/App/ShareExtension/ShareViewController.swift && echo TYPECHECK_OK; } > /tmp/out.txt 2>&1 || true
          git config user.name "debug-bot"; git config user.email "debug-bot@users.noreply.github.com"
          git checkout --orphan debug-out3 && git rm -rqf . && cp /tmp/out.txt out.txt && git add out.txt && git commit -qm out && git push -f origin debug-out3
