name: Debug Instagram post
on: { workflow_dispatch: { inputs: { code: { required: true }, kind: { default: reel } } } }
permissions: { contents: write }
jobs:
  look:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/debug-ig.js "${{ inputs.code }}" "${{ inputs.kind }}" > /tmp/out.txt 2>&1 || true
      - run: |
          git config user.name "debug-bot"; git config user.email "debug-bot@users.noreply.github.com"
          git checkout --orphan debug-out && git rm -rqf . && cp /tmp/out.txt out.txt && git add out.txt && git commit -qm "debug output" && git push -f origin debug-out
