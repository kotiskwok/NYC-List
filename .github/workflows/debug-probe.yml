name: Debug probe
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: |
          { curl -s -m 30 "https://nyc-lovat.vercel.app/api/extract?probe=1"; echo; curl -s -o /dev/null -w "site %{http_code}\n" https://nyc-lovat.vercel.app/; curl -s -o /dev/null -w "photo-probe %{http_code}\n" "https://nyc-lovat.vercel.app/api/photo?probe=1"; } > /tmp/out.txt 2>&1
          git config user.name "debug-bot"; git config user.email "debug-bot@users.noreply.github.com"
          git checkout --orphan debug-out && git rm -rqf . && cp /tmp/out.txt out.txt && git add out.txt && git commit -qm "debug output" && git push -f origin debug-out
