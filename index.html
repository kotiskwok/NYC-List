<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Spotted In</title>
<meta name="theme-color" content="#FFF3DF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Spotted In">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Spotted In: save the NYC restaurants, cafes and cute shops you spot on TikTok and Instagram, and plan where to go.">
<link rel="stylesheet" href="/vendor/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Design tokens: the "NYC List v2" colors in the V5 glass look (deep frosted panels over Apple Maps and soft cream glows). Single deliberate look (no dark variant). */
:root{--blue:#1B3DB8;--navy:#10183F;--orange:#FF6B1A;--yellow:#FFC425;--cream:#FFF3DF;--st:46px;--sb:0px;color-scheme:light;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  /* Soft cream backdrop with faint orange, pink, blue and yellow glows behind the non-map screens, so the glass has color to frost. */
  --bgfx:radial-gradient(60% 34% at 0% 0%,rgba(255,107,26,.2),rgba(255,107,26,0) 70%),radial-gradient(60% 34% at 100% 30%,rgba(244,95,160,.18),rgba(244,95,160,0) 70%),radial-gradient(70% 40% at 0% 72%,rgba(27,61,184,.14),rgba(27,61,184,0) 70%),radial-gradient(60% 34% at 100% 100%,rgba(255,196,37,.22),rgba(255,196,37,0) 70%),#FFF3DF}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--blue);font-family:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;color:var(--navy)}
a{color:var(--blue)}a:hover{color:var(--orange)}
button{font-family:inherit}
input::placeholder,textarea::placeholder{color:#8A8FA8}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.leaflet-container{font-family:'Archivo',sans-serif}
.noscroll{scrollbar-width:none;-webkit-overflow-scrolling:touch}
.noscroll::-webkit-scrollbar{display:none}
/* Scrolling panels: their rows keep their size instead of being squeezed to fit. */
.noscroll>*{flex-shrink:0}
/* A list's spots fade out as they scroll up into the map above. */
.trip-fade{-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 70px);mask-image:linear-gradient(to bottom,transparent 0,#000 70px)}
.press:active{transform:scale(.97)}
.press94:active{transform:scale(.94)}
.ai-busy{animation:aipulse 1.1s ease-in-out infinite}
@keyframes aipulse{50%{opacity:.6}}
.hov:hover{background:var(--cream)!important}
#root{height:100%}
.mono{font-family:var(--mono)}
/* Glass buttons squish a little when pressed. */
.lg{transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
button.lg:active{transform:scale(.95)}
.fld:focus-within{border-color:var(--blue)!important;box-shadow:0 0 0 4px rgba(27,61,184,.12)}
.fld input:focus-visible{outline:none}
.ai-bar{position:relative;overflow:hidden}
.ai-bar::after{content:'';position:absolute;top:0;bottom:0;left:-40%;width:40%;border-radius:3px;background:var(--orange);animation:aibar 1.4s ease-in-out infinite}
@keyframes aibar{to{left:100%}}
.emo{font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;line-height:1;font-style:normal}

/* Desktop: the app sits in the phone frame from the design. */
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;padding:28px 12px;background:var(--blue)}
.device{position:relative;width:390px;max-width:100%;height:844px;border-radius:54px;background:var(--navy);padding:10px;box-shadow:0 30px 80px rgba(5,10,40,.5)}
.screen{position:relative;width:100%;height:100%;border-radius:44px;overflow:hidden;background:var(--bgfx)}
.statusbar{position:absolute;top:0;left:0;right:0;height:46px;z-index:1200;display:flex;align-items:center;justify-content:space-between;padding:4px 30px 0;font-weight:700;font-size:15px;color:var(--navy);pointer-events:none}

/* Phone (or a short window): the app fills the screen, no frame or fake status bar. */
@media (max-width:520px),(max-height:760px){
  body{background:var(--cream);overscroll-behavior:none}
  :root{--st:calc(env(safe-area-inset-top,0px) + 12px);--sb:max(0px,calc(env(safe-area-inset-bottom,0px) - 12px))}
  .stage{padding:0;height:100%;min-height:0;display:block}
  .device{width:100%;height:100%;border-radius:0;padding:0;box-shadow:none;background:var(--cream)}
  .screen{border-radius:0}
  .statusbar{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<script src="/vendor/react.production.min.js"></script>
<script src="/vendor/react-dom.production.min.js"></script>
<script src="/vendor/htm.umd.js"></script>
<script src="/vendor/leaflet.js"></script>
<script src="/vendor/supabase.js"></script>
<script src="/data/nyc-map-data.js"></script>
<script src="/data/nyc-subway-data.js"></script>
<script src="/data/nyc-streets-data.js"></script>
<script src="/data/city-data.js"></script>
<script src="/data/nys-data.js"></script>
<script src="/config.js"></script>
<script src="/src/runtime.js"></script>
<script src="/src/native.js"></script>
<script src="/src/sync.js"></script>
<script src="/src/video.js"></script>
<script src="/src/logic.js"></script>
<script src="/src/lists.js"></script>
<script src="/src/view.js"></script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
}
</script>
</body>
</html>
